spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
# 행 잠금 대기 시간 제한 (docs/api.md 4.5)
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# JWT (docs/api.md 1.2)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=7200s

# 이미지 업로드 (docs/api.md 11.0)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# AI 서버 (docs/api.md 13.0)
ai.server.base-url=${AI_SERVER_URL:http://localhost:8000}
ai.server.connect-timeout=5s
ai.server.read-timeout=60s

# 리버스 프록시(Railway) 뒤에서 X-Forwarded-Proto/Host를 반영 → Swagger 서버 URL이 https로 생성됨
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
