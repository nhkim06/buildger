# 테스트 전용 설정: 임베디드 PostgreSQL에 실제 스키마(create_table.sql)를 적용한다.
# 주의: create_table.sql은 DROP TABLE을 포함하므로 테스트 프로필에서만 실행한다.
DB_URL=jdbc:postgresql://localhost:5432/unused
DB_USER=unused
DB_PASSWORD=unused

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/create_table.sql
spring.jpa.show-sql=false

jwt.secret=test-secret-key-for-integration-tests-0123456789
ai.server.base-url=http://localhost:9
